<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D2R Level Overlay</title>
<!--
  Diablo II: Resurrected character level, live, for an OBS browser source.
  The level comes from the "D2R Level" action of Streamer.bot (streamerbot/D2R-Level-Overlay.sb),
  which broadcasts {"d2r_level": {"level": 62, "xp": 0.35, "levelUp": false, "running": true}}.
  Every look-and-feel option is a URL parameter; build the URL with configure.html.
  ?demo=1 shows fake data (XP going up, a level up every ~12 s) without Streamer.bot.
  Any browser-source size works: the content scales to fit it.
-->
<style>
  :root {
    --accent: #bfa468; --text: #efe6d2; --number: #f3ead6; --fill1: #fff3c4; --fill2: #8a7038; --track: #0b0b0c;
    --glow: #ffd678; --panel: rgba(20, 20, 22, .85); --radius: 4px;
    --font-label: "Cinzel", serif; --font-number: "Grenze Gotisch", serif; --font-text: "Barlow Semi Condensed", sans-serif;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .badge { position: absolute; inset: 0; box-sizing: border-box; transition: opacity .8s; font-family: var(--font-text); color: var(--text); }
  .badge.hidden { opacity: 0; }
  .badge.offline { opacity: .45; }
  .panel { background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: var(--radius); }
  .shadow { text-shadow: 0 2px 2px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6); }

  .label { font-family: var(--font-label); font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--accent);
           font-size: 16px; white-space: nowrap; }
  .num { font-family: var(--font-number); font-weight: 800; color: var(--number); line-height: 1; display: inline-block; transform-origin: 50% 60%; }
  .pct { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pct small { font-size: 17px; opacity: .75; margin-left: 6px; font-weight: 500; }
  .up .label { color: color-mix(in srgb, var(--accent) 50%, white); }

  @keyframes jump { 0% { transform: scale(1) } 30% { transform: scale(1.45) } 100% { transform: scale(1) } }
  @keyframes shine { 12%, 70% { color: color-mix(in srgb, var(--glow) 60%, white);
    text-shadow: 0 2px 2px rgba(0,0,0,.9), 0 0 6px var(--glow), 0 0 18px var(--glow), 0 0 38px color-mix(in srgb, var(--glow) 60%, transparent); } }
  .num.shine { animation: shine 3s ease-in-out; }
  .num.jump.shine { animation: jump .7s cubic-bezier(.3,1.6,.5,1), shine 6s ease-in-out; }
  .noanim * { animation: none !important; transition: none !important; }

  /* XP bar: segmented (10 parts, like the game), solid or none */
  .track { position: relative; overflow: hidden; height: 18px; border-radius: calc(var(--radius) * .75);
           background: color-mix(in srgb, var(--track) 70%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
           box-shadow: 0 2px 8px rgba(0,0,0,.6), inset 0 1px 4px rgba(0,0,0,.9); }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(180deg, var(--fill1), var(--fill2));
          box-shadow: 0 0 10px color-mix(in srgb, var(--glow) 45%, transparent); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
  .fill::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: color-mix(in srgb, var(--fill1) 50%, white);
                 box-shadow: 0 0 8px 2px color-mix(in srgb, var(--glow) 90%, transparent); }
  .parts { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(10,10,11,.9) calc(10% - 2px) 10%); }
  .bar-solid .parts, .bar-none .track, .bar-none .xpblock { display: none; }
  .burst .track { border-color: color-mix(in srgb, var(--accent) 40%, white); box-shadow: 0 0 18px var(--glow), inset 0 1px 4px rgba(0,0,0,.9); }
  .burst .fill { background: color-mix(in srgb, var(--fill1) 40%, white); }

  /* light behind the number on a level up (like the column of light in the game) */
  .numbox { position: relative; display: inline-block; }
  .light { position: absolute; pointer-events: none; opacity: 0; width: 130px; height: 130px; left: 50%; top: 50%; transform: translate(-50%, -50%);
           background: radial-gradient(closest-side, color-mix(in srgb, var(--glow) 70%, transparent), color-mix(in srgb, var(--glow) 25%, transparent) 55%, transparent); }
  @keyframes column { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.4, .7) } 25% { opacity: 1 }
    70% { opacity: .75; transform: translate(-50%, -55%) scale(.9, 1.15) } 100% { opacity: 0; transform: translate(-50%, -65%) scale(1, 1.2) } }
  .up .light { animation: column 2.6s ease-out; }

  /* classic: icon, LEVEL + number; on the right EXPERIENCE + % and the bar */
  .classic { display: flex; align-items: center; gap: 22px; padding: 0 26px; }
  .classic .icon { width: 48px; height: 48px; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.8)); }
  .classic .left { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; min-width: 150px; flex: none; }
  .classic .num { font-size: 56px; }
  .classic .xpblock { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .classic .head { display: flex; justify-content: space-between; align-items: baseline; }
  /* stacked: LEVEL 62 · % on top, bar below */
  .stacked { display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 12px 24px 16px; }
  .stacked .head { display: flex; justify-content: space-between; align-items: center; }
  .stacked .lv { display: flex; align-items: center; gap: 14px; }
  .stacked .num { font-size: 46px; margin-top: -6px; }
  .stacked .track { height: 20px; }
  /* medallion: ring = XP */
  .medallion { display: flex; align-items: center; gap: 22px; padding: 0 18px; }
  .medallion .ring { position: relative; width: 96px; height: 96px; flex: none; border-radius: 50%;
    background: conic-gradient(var(--fill1) calc(var(--xp, 0) * 1turn), color-mix(in srgb, var(--track) 60%, transparent) 0);
    box-shadow: 0 2px 8px rgba(0,0,0,.7); transition: --xp 1.1s; }
  .medallion .ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--track) 70%, #333), var(--track) 70%);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .medallion .ring .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46px; padding-bottom: 4px; }
  .medallion .ring .light { z-index: 0; }
  .medallion .side { display: flex; flex-direction: column; gap: 8px; line-height: 1; }
  .medallion .label { font-size: 18px; }
  .medallion .pct { font-size: 22px; }
  .burst .ring { box-shadow: 0 0 22px var(--glow), 0 2px 8px rgba(0,0,0,.7); }
  @property --xp { syntax: "<number>"; inherits: true; initial-value: 0; }
  /* minimal: just the level */
  .minimal { display: flex; align-items: center; gap: 16px; padding: 0 20px; }
  .minimal .num { font-size: 64px; }
</style>
</head>
<body>
<div id="stage"><div id="badge" class="badge hidden"></div></div>
<script src="shared.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const o = D2RL.options(params);
  const L = Object.assign({}, D2RL.LANGS[o.lang]);
  if (o.labelLevel) L.level = o.labelLevel;
  if (o.labelXp) L.xp = o.labelXp;
  if (o.labelUp) L.up = o.labelUp;
  const demo = params.get("demo") === "1";
  const flag = (k) => o[k] === "1" || o[k] === "true";
  const hex = (v, d) => "#" + (/^[0-9a-f]{3,8}$/i.test(v || "") ? v : d);
  document.documentElement.lang = o.lang;

  // ---- theme ----
  const root = document.documentElement.style;
  for (const k of ["accent", "text", "number", "fill1", "fill2", "track", "glow"]) root.setProperty("--" + k, hex(o[k], D2RL.DEFAULTS[k]));
  const pc = hex(o.panelColor, "141416"), pa = Math.max(0, Math.min(1, parseFloat(o.panelAlpha) || 0));
  root.setProperty("--panel", `color-mix(in srgb, ${pc} ${Math.round(pa * 100)}%, transparent)`);
  root.setProperty("--radius", (parseFloat(o.radius) || 0) + "px");
  const fonts = [o.fontLabel, o.fontNumber, o.fontText].filter(Boolean);
  root.setProperty("--font-label", `"${o.fontLabel}", serif`);
  root.setProperty("--font-number", `"${o.fontNumber}", serif`);
  root.setProperty("--font-text", `"${o.fontText}", sans-serif`);
  // one stylesheet per family: Google Fonts refuses the whole request when a family lacks a
  // weight, so ask for regular + bold and, if refused, for the family as it comes
  for (const f of new Set(fonts)) {
    const fam = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+");
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = fam + ":wght@400;700&display=swap";
    link.addEventListener("error", () => { link.href = fam + "&display=swap"; }, { once: true });
    document.head.appendChild(link);
  }

  // ---- layout ----
  const ICON = '<svg class="icon" viewBox="0 0 48 48" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M24 4 41 10v13c0 10-7 18-17 21C14 41 7 33 7 23V10Z"/><path d="M15 27l9-8 9 8M15 35l9-8 9 8" stroke-linecap="round"/></svg>';
  const NUM = '<span class="numbox"><span class="light"></span><span class="num" data-num>–</span></span>';
  const BAR = '<div class="track"><div class="fill" data-fill></div><div class="parts"></div></div>';
  const TEMPLATES = {
    classic: `<div class="classic">${flag("icon") ? ICON : ""}<div class="left"><span class="label" data-label></span>${NUM}</div>
              <div class="xpblock"><div class="head"><span class="label" data-xplabel></span><span class="pct" data-pct></span></div>${BAR}</div></div>`,
    stacked: `<div class="stacked"><div class="head"><div class="lv"><span class="label" data-label></span>${NUM}</div><span class="pct" data-pct></span></div>
              <div class="xpblock">${BAR}</div></div>`,
    medallion: `<div class="medallion"><div class="ring" data-ring><span class="light"></span><span class="num" data-num>–</span></div>
                <div class="side"><span class="label" data-label></span><span class="pct" data-pct></span></div></div>`,
    minimal: `<div class="minimal">${flag("icon") ? ICON.replace('class="icon"', 'class="icon" style="width:52px;height:52px"') : ""}<div><span class="label" data-label></span><br>${NUM}</div></div>`,
  };
  const size = D2RL.LAYOUTS[o.layout];
  const stage = document.getElementById("stage");
  const badge = document.getElementById("badge");
  stage.style.width = size.w + "px";
  stage.style.height = size.h + "px";
  badge.innerHTML = TEMPLATES[o.layout];
  badge.classList.toggle("panel", flag("panel"));
  badge.classList.toggle("shadow", flag("shadow"));
  badge.classList.add("bar-" + (["segments", "solid", "none"].includes(o.bar) ? o.bar : "segments"));
  if (!flag("anim")) badge.classList.add("noanim");
  const q = (s) => badge.querySelector(s);
  const el = { num: q("[data-num]"), label: q("[data-label]"), xplabel: q("[data-xplabel]"), pct: q("[data-pct]"), fill: q("[data-fill]"),
               ring: q("[data-ring]"), box: badge.firstElementChild };
  el.label.textContent = L.level;
  if (el.xplabel) el.xplabel.textContent = L.xp;

  // fit the browser source: scale the natural size into the window, keeping the aspect
  function fit() {
    const k = Math.min(innerWidth / size.w, innerHeight / size.h) || 1;
    const dx = o.align === "right" ? innerWidth - size.w * k : o.align === "center" ? (innerWidth - size.w * k) / 2 : 0;
    stage.style.transform = `translate(${dx}px, 0) scale(${k})`;
  }
  addEventListener("resize", fit);
  fit();

  // ---- state ----
  let cur = { level: null, xp: null };
  let party = null;

  function setXp(xp, instant) {
    const v = xp == null ? 0 : Math.max(0, Math.min(1, xp));
    for (const [node, apply] of [[el.fill, (n) => n.style.width = v * 100 + "%"], [el.ring, (n) => n.style.setProperty("--xp", v)]]) {
      if (!node) continue;
      if (instant) { node.style.transition = "none"; apply(node); void node.offsetWidth; node.style.transition = ""; }
      else apply(node);
    }
  }
  function texts(n, xp) {
    if (!el.pct) return;
    if (xp == null || !flag("pct")) { el.pct.textContent = ""; return; }
    el.pct.innerHTML = Math.floor(xp * 100) + "%" + (flag("next") && n < 99 ? `<small>${L.next.replace("{n}", n + 1)}</small>` : "");
  }
  function shine(up) {
    el.num.classList.remove("jump", "shine"); void el.num.offsetWidth;
    el.num.classList.add("shine"); if (up) el.num.classList.add("jump");
  }

  function paint(d) {
    const visible = d.level != null && (!flag("hide") || d.running !== false);
    badge.classList.toggle("hidden", !visible);
    if (d.level == null) return;
    const n = Number(d.level), xp = d.xp == null ? null : Number(d.xp);
    const before = cur.level;
    cur = { level: n, xp };
    if (party) { if (party.free && n === party.level) { texts(n, xp); setXp(xp); } return; }
    if (before !== null && n > before && d.levelUp && flag("anim")) return celebrate(n);
    el.num.textContent = n;
    texts(n, xp);
    setXp(xp, before === null);
    if (before !== null && n !== before) shine(n > before && d.levelUp);
  }

  // level up: the bar fills and bursts, the number jumps with light, then the bar starts over
  function celebrate(n) {
    party = { level: n, free: false };
    setXp(1);
    setTimeout(() => {
      el.box.classList.add("burst", "up");
      el.label.textContent = L.up;
      el.num.textContent = n; shine(true);
      texts(n, null);
    }, 900);
    setTimeout(() => { el.box.classList.remove("burst"); setXp(0, true); }, 1700);
    setTimeout(() => { party.free = true; if (cur.level === n) { setXp(cur.xp); texts(n, cur.xp); } }, 1900);
    setTimeout(() => {
      el.box.classList.remove("up"); el.label.textContent = L.level; party = null;
      if (cur.level !== n) paint({ level: cur.level, xp: cur.xp, running: true });
    }, 6500);
  }

  // ---- Streamer.bot WebSocket (with the optional password) ----
  async function sha256b64(text) {
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return btoa(String.fromCharCode(...new Uint8Array(h)));
  }
  function connect() {
    let ws, ready = false, n = 0;
    const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
    const ask = () => send({ request: "DoAction", id: "d2rl-" + (++n), action: { name: o.action }, args: {} });
    const start = () => {
      if (ready) return;
      ready = true;
      send({ request: "Subscribe", id: "d2rl-sub", events: { General: ["Custom"] } });
      ask();
    };
    function open() {
      ws = new WebSocket(`ws://${o.host}:${o.port}/`);
      ready = false;
      let helloTimer;
      ws.onopen = () => { helloTimer = setTimeout(start, 1000); };          // older servers send no Hello
      ws.onmessage = async (e) => {
        let m; try { m = JSON.parse(e.data); } catch { return; }
        if (m.request === "Hello") {
          clearTimeout(helloTimer);
          // Streamer.bot 1.0.7 sends a salt and challenge in every Hello, also when its server
          // does not require a password: only authenticate when a password was given.
          const a = m.authentication;
          if (a && a.challenge && o.pass) {
            const secret = await sha256b64(o.pass + a.salt);
            send({ request: "Authenticate", id: "d2rl-auth", authentication: await sha256b64(secret + a.challenge) });
            return;
          }
          return start();
        }
        if (m.id === "d2rl-auth") { if (m.status === "ok") start(); else console.warn("D2R Level: wrong Streamer.bot password"); return; }
        if (m.id === "d2rl-sub" && m.status && m.status !== "ok")
          console.warn("D2R Level: Streamer.bot refused the subscription (" + (m.error || m.status) + ") - if its server requires a password, add &pass=... to the address");
        const d = m.data && (m.data[o.event] || (m.data.data && m.data.data[o.event]));
        if (d) paint(d);
      };
      ws.onclose = () => { badge.classList.add("offline"); setTimeout(open, 3000); };
      ws.onerror = () => ws.close();
      ws.addEventListener("open", () => badge.classList.remove("offline"));
    }
    open();
    setInterval(ask, 60000);
  }

  // the configurator talks to the preview through postMessage
  addEventListener("message", (e) => { if (e.data && e.data.d2rl) paint(e.data.d2rl); });

  if (demo) {
    let lv = 61, xp = 0.62;
    paint({ level: lv, xp, running: true });
    setInterval(() => {
      xp += 0.06;
      if (xp >= 1) { lv = lv >= 99 ? 1 : lv + 1; xp = 0.03; paint({ level: lv, xp, levelUp: true, running: true }); }
      else paint({ level: lv, xp, running: true });
    }, 1300);
  } else if (params.get("preview") !== "1") {
    connect();
  }
</script>
</body>
</html>
